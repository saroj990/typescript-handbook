<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — TypeScript Handbook</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: #0b1220;
        color: #e8eef7;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      a {
        color: #4b9bde;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        The TypeScript Handbook is designed to work offline after the first visit.
        Reconnect once to cache the app, then you can keep learning without a network.
      </p>
      <p><a href="/">Try opening the handbook again</a></p>
    </main>
  </body>
</html>
